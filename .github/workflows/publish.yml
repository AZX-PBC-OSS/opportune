name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with the workspace version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::publish runs from a release tag; ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}"
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          # The same gate `make lint` and ci.yml's lint job run: 5-way parity across
          # Cargo.toml, version.txt, the npm package's manifest, its TypeScript
          # `VERSION` constant and release-please's own manifest, plus
          # rust-toolchain.toml's channel against the declared MSRV. release-please's
          # `extra-files` entries are what keep the version files together; a hand
          # edit of any one of them — or a toolchain pin left
          # behind by an MSRV bump — fails this tag instead of publishing a version
          # the release PR did not declare.
          make check-version
          printf 'tag %s, workspace version %s\n' "${GITHUB_REF_NAME}" "${version}"
          test "v${version}" = "${GITHUB_REF_NAME}"

  verify:
    # The tagged commit is the one that reaches crates.io and PyPI, so the dependency policy
    # and both test suites are re-run here before any artefact is offered. It is not a
    # re-run of every gate main was merged under: the lint job's fmt, clippy, rustdoc,
    # codegen, licence-copy and package-listing checks, the feature matrix and the docs
    # build are not repeated, so a tag has to come from a commit that passed them. It is
    # gated on version-check so a mislabelled tag fails before the wheel matrix starts, and
    # every publishing lane is gated on it in turn.
    name: Verify dependencies and tests on the tagged commit
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The workspace's Rust tests include the pyo3 crate, so the harness links
      # libpython and needs an interpreter to find.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # `make test-py` runs the Python doc-snippet gate under pyright, whose wrapper
      # runs the language server on Node and prefers a `node` already on PATH.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest

      - name: Cargo deny (default-build allow-list)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

      - name: Cargo deny (minimal-build allow-list)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --config deny.minimal.toml
          command-arguments: licenses

      - name: Cargo nextest
        run: cargo nextest run --locked --all-features

      - name: Cargo doctests
        run: cargo test --doc --locked --all-features

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Rebuild the extension from the tagged sources
        # uv's cache can serve a wheel built from an earlier commit: its key covers the
        # Python project, not the crates/ sources the extension is compiled from.
        # `--reinstall-package` makes the build use this checkout, which is also what
        # ci.yml's Python job does.
        run: make dev

      - name: Pytest
        # The wheel this workflow publishes is built from the same tag, so the release
        # gate runs the Python suite too, against the extension the step above built from
        # this checkout.
        run: make test-py

  wheels-linux:
    needs: [version-check, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          # Pinned like `wasm-pack` in ci.yml: this tool decides how the tagged
          # sources are compiled and what metadata the wheel carries, so a `latest`
          # bump would move published bytes with no diff here. Bump it deliberately.
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/opportune-py/Cargo.toml --release --locked --out dist
          # Logged from inside the manylinux container the wheel is compiled in, so the
          # record names the compiler that built it rather than the runner's.
          before-script-linux: rustc -Vv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  wheels-other:
    needs: wheels-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: windows-2025
            target: x64
          - os: windows-11-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Log the toolchain
        # This lane compiles on the runner itself, so the host `rustc` is the one that
        # builds the wheel; the version goes into the run log beside the artefact.
        run: rustc -Vv

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          args: --manifest-path crates/opportune-py/Cargo.toml --release --locked --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: [version-check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.16.0
          args: --manifest-path crates/opportune-py/Cargo.toml --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  build-npm:
    # The npm package is built, tested and packed here, in a job that holds no OIDC
    # identity and performs no publish, so the publishing lane below offers an artefact
    # instead of producing one. `make test-wasm` is the target CI's wasm lane runs and the
    # one this workflow ran in-line before: one `wasm-pack` release build, `npm ci` from
    # the committed lockfile, `tsc`, the gzipped size budget, `node --test` and the
    # TypeScript snippet gate. The tarball is packed once, from the `dist/` that suite
    # answered from, and published from that file — never re-packed.
    name: Build and test the npm package the release publishes
    needs: [version-check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install wasm-pack
        # The same pin ci.yml's wasm lane carries, for the same reason: this tool's
        # release decides which binaryen optimises the module, so it decides the bytes of
        # the tarball the registry receives. Bump it deliberately. See the comment on the
        # step in ci.yml's `test-wasm`.
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-pack@0.15.1

      - name: Build, size-check and test the package
        # A fresh checkout has no `node_modules`, so `npm ci` runs first from the
        # committed lockfile as the `wasm` target's prerequisite; then the release build,
        # `npm run build`, the gzipped size budget, `node --test` and the snippet gate.
        run: make test-wasm

      - name: Pack the tarball the release publishes
        # The release tarball is packed here and nowhere else in this workflow: packs used
        # by the suite's consumer fixtures stay in their temporary directories and are
        # never uploaded, so there is one release artefact to download and one set of bytes
        # to attest. `--ignore-scripts` keeps a future lifecycle hook from running at pack
        # time in the job that produces the release bytes. Packing into `runner.temp`
        # leaves the checkout's `dist/` exactly as the suite read it.
        run: |
          mkdir -p "${RUNNER_TEMP}/npm-publish"
          npm pack --pack-destination "${RUNNER_TEMP}/npm-publish" --ignore-scripts
        working-directory: crates/opportune-wasm/js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Deliberately not `npm-package-tarball`, the name ci.yml's `test-wasm` gives
          # the tarball its runtime lanes execute: that artifact is produced by a
          # different workflow and consumed by jobs in it, and this one is produced and
          # consumed by this release run alone.
          name: npm-publish-tarball
          path: ${{ runner.temp }}/npm-publish/*.tgz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels-linux, wheels-other, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no API token is stored in the repository.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Verify every distribution downloaded
        # upload-artifact only warns on a missing path and download-artifact succeeds on a
        # pattern that matches nothing, so a short matrix has to fail here.
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          printf 'wheels: %d, sdists: %d\n' "${#wheels[@]}" "${#sdists[@]}"
          test "${#wheels[@]}" -eq 8
          test "${#sdists[@]}" -eq 1

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # Re-dispatching a tag whose files already reached PyPI has to go green instead
          # of failing on filename reuse; the crates.io leg below gates the same way with
          # its 200 probe. A partial upload resumes: only the missing files are sent.
          skip-existing: true

  publish-npm:
    # Nothing here builds, installs or packs: the tarball arrives from `build-npm` as an
    # artifact, so this job — the one holding `id-token: write` — runs no package build or
    # test tooling and never executes the package's devDependency tree. Its only registry
    # operation is the npm CLI against bytes another job already built and tested. Gated
    # on `verify` for the reason every publishing lane is: the
    # tagged commit is the one that reaches the registry. npm Trusted Publishing exchanges
    # the job's OIDC identity for a short-lived token, so no API token is stored in the
    # repository; `--provenance` attaches the signed build attestation npm renders on the
    # package page. The step below publishes directly, so the trusted publisher has to be
    # one that allows `npm publish`: a configuration created on npmjs.com allows only
    # `npm stage publish` unless that is also selected.
    name: Publish to npm
    needs: [version-check, verify, build-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # Trusted Publishing; no API token is stored in the repository.
    steps:
      # `registry-url` is what points the CLI at the public registry rather than at
      # whatever npmrc the runner image carries. Provenance additionally requires the
      # package's `repository` to name the repository the workflow runs in, which this
      # one's manifest does; the OIDC token Trusted Publishing exchanges carries the same
      # repository and workflow identity the npm trusted publisher is configured with.
      #
      # `package-manager-cache: false` because this manifest declares `packageManager`,
      # which is the field that switches setup-node's automatic npm caching on by
      # default — and this is the job holding `id-token: write`, where the action's own
      # security note and npm's release-build guidance both say not to restore a cache
      # written elsewhere. Nothing in this job resolves a dependency, so nothing needs one.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the tarball the release publishes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-publish-tarball
          path: ${{ runner.temp }}/npm-publish

      - name: Verify the artifact is the one tarball for this tag
        # Three facts, all read from the archive itself rather than from a checkout, so
        # the identity asserted is the identity published: exactly one tarball arrived,
        # its file name is the `name-version.tgz` its own manifest declares, and that
        # version is the tag's — `version-check` has already tied the tag to the workspace
        # version, so this ties the artefact to the same release. A second tarball, a
        # stale one, or one re-packed from a different version fails here instead of at
        # the registry, where a version cannot be taken back.
        id: tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("${RUNNER_TEMP}"/npm-publish/*.tgz)
          printf 'tarballs: %d\n' "${#tarballs[@]}"
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          read -r name version < <(python3 -c 'import json, sys, tarfile; manifest = json.load(tarfile.open(sys.argv[1]).extractfile("package/package.json")); print(manifest["name"], manifest["version"])' "${tarball}")
          test "${tarball##*/}" = "${name}-${version}.tgz"
          test "v${version}" = "${GITHUB_REF_NAME}"
          printf 'name=%s\nversion=%s\ntarball=%s\n' "${name}" "${version}" "${tarball}" >> "${GITHUB_OUTPUT}"
          printf '%s is %s@%s\n' "${tarball}" "${name}" "${version}"

      - name: Publish
        # A re-dispatch of a tag whose version already reached npm has to go green
        # rather than fail on the registry's version conflict; `npm view` answering with
        # the version is the same probe the crates.io leg uses. A registry failure is
        # not read as "not published": the publish attempt that follows fails too, so an
        # outage is red rather than silently skipped.
        env:
          PACKAGE: ${{ steps.tarball.outputs.name }}
          VERSION: ${{ steps.tarball.outputs.version }}
          TARBALL: ${{ steps.tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE}@${VERSION} is already on npm; nothing to publish"
            exit 0
          fi
          # `--ignore-scripts` keeps a lifecycle hook in a future manifest from running in
          # the one job holding `id-token: write`; the path is the verified artifact, so
          # this publishes exactly the bytes `build-npm` packed and tested.
          npm publish "${TARBALL}" --ignore-scripts --provenance --access public

  publish-crate:
    name: Publish to crates.io
    needs: [version-check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Trusted Publishing; no API token is stored in the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package verification build needs an interpreter for pyo3.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"

          # Releases are answered with 200 once the version is in crates.io's database,
          # 404 while it is not, and curl writes 000 when the request never completed.
          # Any other answer is the registry failing rather than telling us something, so
          # it aborts instead of being read as "not published".
          published() {
            curl -sS -o /dev/null -w '%{http_code}' --retry 5 --max-time 30 \
              -A opportune-publish-workflow \
              "https://crates.io/api/v1/crates/$1/${version}"
          }

          # opportune-json and opportune-adapters depend on the crate before them, and a
          # published crate's manifest names the registry only, so each one has to be
          # visible to crates.io before the next can verify. A wait allows 30 polls ten
          # seconds apart, and the job's `timeout-minutes` is the hard bound above that: a
          # registry answering slowly can exhaust the job rather than the loop.
          for crate in opportune opportune-json opportune-adapters; do
            # The fallback sits on the assignment, not inside the substitution: curl has
            # already written 000 by the time it exits non-zero, so a second value there
            # concatenates into "000000" — a status code that does not exist — in the very
            # message an on-call engineer reads to find out what the registry said.
            status="$(published "${crate}")" || status=000
            case "${status}" in
              200)
                echo "::notice::${crate}@${version} is already on crates.io; nothing to publish"
                continue
                ;;
              404) ;;
              *)
                echo "::error::crates.io answered ${status} for ${crate}@${version}"
                exit 1
                ;;
            esac

            cargo publish --locked -p "${crate}"

            visible=""
            for _attempt in $(seq 1 30); do
              answer="$(published "${crate}")" || answer=000
              if [ "${answer}" = "200" ]; then
                visible=yes
                break
              fi
              sleep 10
            done
            # The failure is decided after the loop rather than by comparing the counter
            # with the poll count, so the two cannot drift apart: a wait that ends without
            # a 200 is a failure whatever ended it, and the loop can never fall through to
            # the next crate — or to a green job — on an unconfirmed publish.
            if [ -z "${visible}" ]; then
              echo "::error::${crate}@${version} did not become visible on crates.io; the registry last answered ${answer:-nothing}"
              exit 1
            fi
            echo "${crate}@${version} is visible on crates.io"
          done
