# Four dependency graphs, four lanes. Commit titles are Conventional Commits so the
# commitlint gate accepts them and release-please can parse them; the minor/patch groups
# collapse routine bumps into one PR per ecosystem instead of one per package.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-rust)"
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]

  # `uv`, not `pip`: the uv ecosystem understands pyproject.toml and maintains uv.lock,
  # so a bump arrives with the lockfile already refreshed. The Python project lives in
  # crates/opportune-py, beside the Cargo.toml maturin builds from.
  - package-ecosystem: uv
    directory: "/crates/opportune-py"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-py)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # The npm package's build tooling: the TypeScript compiler, json-schema-to-typescript,
  # and the Node type definitions — all devDependencies, none of them in the tarball a
  # consumer installs. This lane is what keeps the lockfile current and its packages
  # receiving upstream fixes; `cargo deny` reads the Cargo graph, not this one.
  - package-ecosystem: npm
    directory: "/crates/opportune-wasm/js"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-js)"
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]

  # Every action in this repo is pinned to a commit SHA, which is exactly why this lane
  # exists: SHA pins without it never receive upstream security fixes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-ci)"
    groups:
      github-actions:
        patterns: ["*"]
