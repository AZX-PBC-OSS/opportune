# The minimal-build allow-list, used by `make deny`'s second check and CI as
# `cargo deny --config deny.minimal.toml check licenses` (`--config` is a global flag and
# must precede the subcommand). It re-checks the licence policy with default features
# off, where the Windows zone mapping behind `opportune-adapters`' `windows-zones` — the
# one dependency only a default feature reaches, and the one whose Unicode-DFS-2016
# licence sits beyond the standard Rust ecosystem's — is out of the graph, so a strict
# adopter compiling that feature out never inherits a licence the default graph hides.
#
# It is not a whole-workspace minimal build: `opportune`'s `bundled-tzdb` stays on
# here, because every binding depends on the core with its defaults and cargo unifies
# features across the workspace. The two published crates keep `opportune-json`'s
# `schema` off — both declare `default-features = false` on it — so no wheel or .crate
# ever reaches `schemars`. The workspace's own schema exporter does: the testkit's
# `export_schema` binary reads the adapters' `schema` bundle to generate the Python
# models, and that dependency is what puts `schemars` (MIT) in this graph. It is
# unpublished tooling, so it adds no licence any adopter receives.
#
# Every section other than `[graph]` and `[licenses]` must match `deny.toml` exactly.
[graph]
all-features = false
no-default-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
