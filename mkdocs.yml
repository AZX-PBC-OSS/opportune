site_name: opportune
site_description: Calendar availability and scheduling calculations across constraints
site_url: https://azx-pbc-oss.github.io/opportune/
repo_url: https://github.com/AZX-PBC-OSS/opportune
repo_name: AZX-PBC-OSS/opportune

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - API reference: api.md
  - Recipes: recipes.md
  - WASM and TypeScript: wasm.md
  - Crate structure: crates.md
  - Design principles: design.md
  - Dependencies and licensing: dependencies.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
