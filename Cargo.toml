[workspace]
# Edition 2024 implies resolver 3; a virtual manifest does not pick it up
# automatically, so declare it to keep the resolution behaviour explicit.
resolver = "3"
members = [
    "crates/opportune",
    "crates/opportune-testkit",
    "crates/opportune-json",
    "crates/opportune-adapters",
    "crates/opportune-py",
    "crates/opportune-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["AZX, PBC. <oss@azx.io>"]
license = "MIT OR Apache-2.0"
homepage = "https://azx-pbc-oss.github.io/opportune/"
repository = "https://github.com/AZX-PBC-OSS/opportune"

# `serde`, `serde_json` and `thiserror` are what most members need, so they are declared
# once here and their versions are visible in one place instead of drifting between
# manifests. A member keeps its own `optional` and `features` choices — inheritance unions
# the two feature sets — but not its own `version`: cargo reports a member-level `version`
# beside `workspace = true` as an unused manifest key and resolves the one declared here.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Declared once and inherited by every member through `[lints] workspace = true`, so a crate
# added under crates/ later gets the policy by default instead of silently shipping without
# it. `clippy::pedantic` is a warning at the table and CI runs clippy with `-D warnings`, so
# it is denied in CI and advisory locally.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `assert!(collection.is_empty())` is clearer than `assert_eq!(collection, [] as [T; 0])`.
assert_is_empty = "allow"

# The testkit's naive oracle is intentionally quadratic-ish in the size of the
# generated input; optimising it keeps property tests fast without pulling
# optimisation into the rest of the test build.
[profile.test.package.opportune-testkit]
opt-level = 2

[profile.release]
# pyo3 turns panics into Python exceptions at the FFI boundary, which requires
# unwinding: `panic` stays at its default of "unwind".
lto = "fat"
codegen-units = 1
strip = "symbols"

# wasm-bindgen reads `target_features` from the crate's wasm output; stripping it
# drops that section and makes wasm-pack warn. wasm-opt still optimises and strips
# the final .wasm output, while opportune-py keeps `strip = "symbols"`.
[profile.release.package.opportune-wasm]
strip = "none"
