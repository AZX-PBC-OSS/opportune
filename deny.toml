[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The default-build allow-list. The minimal-build list — these entries minus
# `Unicode-DFS-2016`, checked with default features off — lives in
# `deny.minimal.toml` and is enforced by `make deny` and CI alongside this one.
# `jiff`'s `Unlicense OR MIT` satisfies the list through its MIT half, so it needs
# no entry of its own.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  # Legacy SPDX id for the Unicode data licence; windows-timezones (CLDR mapping)
  # declares Unicode-DFS-2016, which grants the same rights for the data files.
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
